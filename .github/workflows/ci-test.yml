name: CI Test

on:
  push:
    branches: ['dev']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: npm install
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          npm i --legacy-peer-deps
          cd packages/office-viewer
          npm i --legacy-peer-deps
          cd ../../

      - name: build packages
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          npm run build --workspace amis-formula
          npm run build --workspace amis-core
          npm run build --workspace amis-ui
          npm run build --workspace amis
          npm run build --workspace amis-editor-core
          npm run build --workspace amis-editor

      - name: typescript check
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          npm run typecheck

      - name: test
        run: |
          npm test --workspaces
          cd packages/office-viewer
          npm test
          cd ../../
