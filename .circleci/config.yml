version: 2.1

jobs:
  lint-and-test:
    docker:
      - image: cimg/node:20.19
    steps:
      - checkout
      - run:
          name: Enable pnpm (corepack)
          command: |
            corepack enable
            corepack prepare pnpm@10 --activate
            pnpm --version
      - restore_cache:
          keys:
            - pnpm-store-v3
      - run:
          name: pnpm install
          command: pnpm install --no-frozen-lockfile
      - run:
          name: Remove broken canvas native module (optional jsdom dep)
          command: rm -rf node_modules/canvas packages/*/node_modules/canvas 2>/dev/null || true
      - save_cache:
          key: pnpm-store-v3
          paths:
            - ~/.local/share/pnpm/store
            - ~/.pnpm-store
            - node_modules
            - packages/*/node_modules
      - run:
          name: build amis-formula
          command: pnpm --filter amis-formula run build
      - run:
          name: build amis-core
          command: pnpm --filter amis-core run build
      - run:
          name: typescript check
          command: pnpm run typecheck
      - run:
          name: test amis-formula
          command: pnpm --filter amis-formula run test
      - run:
          name: test amis-core
          command: pnpm --filter amis-core run test
      - run:
          name: test amis-ui
          command: pnpm --filter amis-ui run test
      - run:
          name: test amis
          environment:
            NODE_OPTIONS: '--max-old-space-size=4096'
          command: pnpm --filter amis run test

  build:
    docker:
      - image: cimg/node:20.19
    resource_class: large
    steps:
      - checkout
      - run:
          name: Enable pnpm (corepack)
          command: |
            corepack enable
            corepack prepare pnpm@10 --activate
            pnpm --version
      - restore_cache:
          keys:
            - pnpm-store-v3
      - run:
          name: pnpm install
          command: pnpm install --no-frozen-lockfile
      - save_cache:
          key: pnpm-store-v3
          paths:
            - ~/.local/share/pnpm/store
            - ~/.pnpm-store
            - node_modules
            - packages/*/node_modules
      - run:
          name: build packages
          command: |
            pnpm --filter amis-formula run build
            pnpm --filter amis-core run build
            pnpm --filter amis-ui run build
            pnpm --filter amis run build
            pnpm --filter amis-editor-core run build
            pnpm --filter amis-editor run build

workflows:
  ci:
    jobs:
      - lint-and-test
      - build:
          requires:
            - lint-and-test
